[project]
name = "cv-labs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "ultralytics",
    "opencv-python",
    "pillow",
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = ["ipykernel", "jupyter", "ruff", "pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"